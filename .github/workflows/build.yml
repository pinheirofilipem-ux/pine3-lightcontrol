# Compila e testa em Windows a cada push. Cria a release no GitHub com o instalador
# numa tag v<versão> (tem de bater com o .csproj) ou quando é corrido à mão
# (Actions → Build → Run workflow) com "release" ligado: aí cria a tag v<versão>.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create the GitHub release (tag v<version>) from this commit"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/Pine3LightControl/Pine3LightControl.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $iss = Select-String -Path installer.iss -Pattern '#define AppVersion\s+"([^"]+)"'
          if ($iss.Matches[0].Groups[1].Value -ne $v) { throw "installer.iss ($($iss.Matches[0].Groups[1].Value)) != csproj ($v)" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "Tag $env:GITHUB_REF_NAME != v$v (csproj)" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Testes
        run: dotnet test tests\Pine3LightControl.Tests -c Release --nologo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Testes da integração do Home Assistant
        run: |
          pip install bleak bleak-retry-connector
          python -m unittest discover -s tests/ha -v

      - name: Publish
        run: dotnet publish src\Pine3LightControl\Pine3LightControl.csproj -c Release -o dist\app --nologo

      # Abre a app a sério (janela, tray, todas as páginas) e falha se houver exceção
      - name: Auto-teste da UI
        shell: pwsh
        run: |
          $p = Start-Process dist\app\Pine3LightControl.exe -ArgumentList '--self-test' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "auto-teste não terminou em 2 min" }
          Get-Content "$env:TEMP\Pine3LightControl-selftest\pine3lightcontrol.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "auto-teste falhou (código $($p.ExitCode))" }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }

      - uses: actions/upload-artifact@v4
        with:
          name: Pine3LightControl-Setup-${{ steps.ver.outputs.version }}
          path: dist/Pine3LightControl-Setup-*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pine3 Light Control ${{ steps.ver.outputs.version }}
          files: dist/Pine3LightControl-Setup-*.exe
          generate_release_notes: true
          # Versões 0.x são de teste
          prerelease: ${{ startsWith(steps.ver.outputs.version, '0.') }}
